cases:
  - id: objectlink-vs-state
    prompt: "解释 ArkUI 中 ObjectLink 是什么，什么时候用它代替 State？"
    must_include:
      - "Observed"
      - "ObjectLink"
      - "父子组件"
      - "对象属性"
    must_not_include:
      - "useState"
      - "React Hook"

  - id: api24-existing-project
    prompt: "现有生产相机工程 compile 和 target 都是 API 24，本次只修相机功能，不升级 SDK。"
    must_include:
      - "API 24"
      - "生产"
      - "module.json5"
    must_not_include:
      - "默认使用 API 26"
      - "HarmonyOS 7 Beta 默认"

  - id: api26-release-migration
    prompt: "新建 HarmonyOS 7 / API 26 生产工程，SDK 和旧设备兼容应该怎样选择？"
    must_include:
      - "Release"
      - "compatibleSdkVersion"
      - "targetSdkVersion"
    must_not_include:
      - "仅供预览"
      - "API 26 只能用于 Beta"

  - id: stage-model-new-app
    prompt: "新建鸿蒙应用应该用 FA 模型还是 Stage 模型？"
    must_include:
      - "Stage"
      - "FA"
      - "legacy"
    must_not_include:
      - "新项目优先 FA"

  - id: permission-camera
    prompt: "ArkTS 里申请相机权限怎么写？"
    must_include:
      - "module.json5"
      - "ohos.permission.CAMERA"
      - "requestPermissionsFromUser"
    must_not_include:
      - "AndroidManifest.xml"

  - id: lazyforeach-performance
    prompt: "鸿蒙大列表卡顿怎么优化？"
    must_include:
      - "LazyForEach"
      - "稳定 key"
      - "渲染"
    must_not_include:
      - "RecyclerView"

  - id: arkts-strict-review
    prompt: "帮我 review 一段 ArkTS 代码，看看有没有类型问题。"
    must_include:
      - "strict"
      - "类型"
      - "ArkTS"
    must_not_include:
      - "any 随便用"

  - id: build-error-routing
    prompt: "DevEco Studio 编译报错，我应该先提供哪些信息？"
    must_include:
      - "DevEco Studio"
      - "compileSdkVersion"
      - "module.json5"
      - "oh-package.json5"
    must_not_include:
      - "只重启电脑"

  - id: native-api-compatibility
    prompt: "compatibleSdkVersion 是 API 20，但 Native 代码调用了更高版本 C API，怎样避免低版本设备崩溃？"
    must_include:
      - "APIAVAILABLE"
      - "弱引用"
      - "依赖库"
      - "低版本设备"
    must_not_include:
      - "只判断 SystemCapability"

  - id: linux-ci-pipeline
    prompt: "给我一套 HarmonyOS Linux CI 构建、签名和真机安装的关键步骤。"
    must_include:
      - "JDK 17"
      - "ohpm install"
      - "--no-daemon"
      - "caseSensitiveCheck"
      - "hdc"
    must_not_include:
      - "提交明文签名密码"

  - id: arkts-leak-detection
    prompt: "ArkTS 页面对象疑似泄漏，应该怎么检测？可以在线上长期打开吗？"
    must_include:
      - "jsLeakWatcher"
      - "开发态"
      - "灰度"
    must_not_include:
      - "生产环境长期常驻"

  - id: container-reader-layout
    prompt: "组件需要根据自身容器宽度而不是窗口宽度切换布局，应该用什么？"
    must_include:
      - "ContainerReader"
      - "容器"
      - "断点"
    must_not_include:
      - "只能使用窗口断点"

  - id: napi-native-callback
    prompt: "Native 传感器线程缓存主线程 env，直接 napi_call_function 偶发崩溃，页面退出也会崩，怎么修？"
    must_include:
      - "napi_threadsafe_function"
      - "napi_queue_full"
      - "生命周期"
    must_not_include:
      - "加锁后直接跨线程调用"

  - id: napi-async-cancellation
    prompt: "napi_async_work 取消返回成功，能否立即 delete context 并在 execute 中构造 napi_value？"
    must_include:
      - "execute"
      - "complete"
      - "napi_delete_async_work"
    must_not_include:
      - "取消成功立即释放 context"

  - id: napi-retained-callback
    prompt: "把 napi_value callback 存到全局，下次异步回调再用，如何修复并支持多个 Worker？"
    must_include:
      - "napi_ref"
      - "napi_delete_reference"
      - "环境"
    must_not_include:
      - "所有 Worker 共用一个 env"
