name: Validate skills

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skill metadata and routes
        run: python scripts/check-frontmatter.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check generated distributions
        run: python scripts/build_dist.py --check
      - name: Check automation CLI
        run: python harmony-hdc-ui-automation/scripts/harmony_hdc_ui.py --help
